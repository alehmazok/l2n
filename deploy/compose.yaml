# Production stack. Lives on the VPS next to a .env made from deploy/.env.example;
# the Deploy workflow copies this file there and runs `docker compose up`.
name: l2n

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: l2n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: l2n
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U l2n -d l2n"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    image: ghcr.io/alehmazok/l2n-server:${L2N_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://l2n:${POSTGRES_PASSWORD}@db:5432/l2n
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ghcr.io/alehmazok/l2n-web:${L2N_TAG:-latest}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_healthy

volumes:
  db-data:
  caddy-data:
  caddy-config:
