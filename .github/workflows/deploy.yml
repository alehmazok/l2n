name: Deploy
# After CI passes on main: build the server and web images, push them to GHCR,
# then roll them out on the VPS with Docker Compose. See docs/deploy.md.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/alehmazok
  # The commit CI tested (workflow_run) or the one picked by hand (workflow_dispatch).
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  images:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [server, web]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/${{ matrix.image }}.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/l2n-${{ matrix.image }}:${{ env.SHA }}
            ${{ env.REGISTRY }}/l2n-${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ vars.VPS_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/l2n' }}
    steps:
      - name: Check deploy settings
        id: settings
        run: |
          if [ -z "$VPS_HOST" ]; then
            echo "::notice::VPS_HOST is not set in the production environment; images were pushed but nothing was deployed. See docs/deploy.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.settings.outputs.ready == 'true'
        with:
          ref: ${{ env.SHA }}
      - name: Set up SSH
        if: steps.settings.outputs.ready == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' \
            "$VPS_HOST" "$VPS_USER" "$VPS_PORT" > ~/.ssh/config
      - name: Copy compose file
        if: steps.settings.outputs.ready == 'true'
        run: scp deploy/compose.yaml "vps:$DEPLOY_PATH/compose.yaml"
      - name: Pull and restart
        if: steps.settings.outputs.ready == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Log in with the job token, valid only while this job runs: the VPS keeps no lasting registry credentials.
          printf '%s' "$GHCR_TOKEN" | ssh vps "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          status=0
          ssh vps "cd '$DEPLOY_PATH' && L2N_TAG='$SHA' docker compose pull" || status=$?
          ssh vps "docker logout ghcr.io" || true
          [ "$status" -eq 0 ]
          # The server applies pending migrations on start; --wait fails the job if it never gets healthy.
          ssh vps "cd '$DEPLOY_PATH' && L2N_TAG='$SHA' docker compose up -d --remove-orphans --wait --wait-timeout 180 && docker image prune -f"
      - name: Show service status
        if: always() && steps.settings.outputs.ready == 'true'
        run: ssh vps "cd '$DEPLOY_PATH' && docker compose ps && docker compose logs --tail 50 server"
