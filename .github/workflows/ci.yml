name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: l2n
          POSTGRES_PASSWORD: l2n
          POSTGRES_DB: l2n_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U l2n"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI database for the Postgres store contract tests.
      TEST_DATABASE_URL: postgres://l2n:l2n@localhost:5432/l2n_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Runs every package's tests (same as `pnpm test`) and measures coverage.
      - run: pnpm coverage
      - name: Coverage summary
        if: always()
        run: test -f coverage/coverage-summary.json && node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14
      - run: pnpm build
